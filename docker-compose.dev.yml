services:
  # Все порты опубликованы только на loopback: без префикса Docker слушает 0.0.0.0, и
  # MySQL с пустым root-паролем, почтовый UI без аутентификации и dev-сайт становятся
  # доступны любому хосту локальной сети — стереть cms_test посреди прогона одна команда.
  php:
    build:
      context: .
      dockerfile: docker/php-dev.Dockerfile
    container_name: cms-php-1
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      CMS_DB_HOST: db
      CMS_DB_PORT: '3306'
      CMS_DB_NAME: cms_dev
      CMS_DB_USER: root
      CMS_DB_PASS: ''
      CMS_SITE_URL: http://localhost:8080
      CMS_TABLE_PREFIX: tbl_
      CMS_SMTP_HOST: mailpit
      CMS_SMTP_PORT: '1025'
      CMS_MAILPIT_URL: http://mailpit:8025
      # Каталог дополнительных приложений: пустая строка — значит «дополнений нет».
      CMS_EXTRA_APPS_DIR: ''
    command: php -S 0.0.0.0:8080 -t public public/index.php
    # mailpit обязана подняться вместе с базой: иначе прогон с SMTP-тестом падает по
    # connection refused из-за порядка старта контейнеров, а не из-за кода.
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: cms-db-1
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    # Сопоставление сервера задаётся явно: базы без `COLLATE` (и дамп с хостинга) иначе получают
    # utf8mb4_0900_ai_ci от 8.0, которого MySQL 5.7 на боевом хостинге не знает.
    # cms_dev и cms_test с нужным COLLATE создаёт docker/mysql-init.sql.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - cms-db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    container_name: cms-mailpit-1
    ports:
      - '127.0.0.1:8025:8025'

volumes:
  cms-db-data:
