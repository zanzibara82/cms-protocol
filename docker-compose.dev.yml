services:
  # Все порты опубликованы только на loopback: без префикса Docker слушает 0.0.0.0, и
  # MySQL с известным dev-паролем, почтовый UI без аутентификации и dev-сайт становятся
  # доступны любому хосту локальной сети — стереть cms_test посреди прогона одна команда.
  php:
    build:
      context: .
      dockerfile: docker/php-dev.Dockerfile
    container_name: cms-php-1
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      CMS_DB_HOST: db
      CMS_DB_PORT: '3306'
      CMS_DB_NAME: cms_dev
      CMS_DB_USER: root
      CMS_DB_PASS: root
      CMS_SITE_URL: http://localhost:8080
      CMS_TABLE_PREFIX: tbl_
      CMS_SMTP_HOST: mailpit
      CMS_SMTP_PORT: '1025'
      CMS_MAILPIT_URL: http://mailpit:8025
      # Каталог дополнительных приложений: пустая строка — значит «дополнений нет».
      CMS_EXTRA_APPS_DIR: ''
      # Память PHP: стандартных 128 МБ не хватает PHPStan на всём дереве, и анализ умирал
      # не на коде, а на лимите. Каталог с настройками лежит в репозитории и подключается
      # без пересборки образа.
      PHP_INI_SCAN_DIR: '/usr/local/etc/php/conf.d:/app/docker/php-conf'
    command: php -S 0.0.0.0:8080 -t public public/index.php
    # mailpit обязана стать готовой к приёму почты вместе с базой: иначе прогон с SMTP-тестом
    # падает по connection refused из-за порядка старта контейнеров, а не из-за кода. Порождается
    # это условие тем, что ворота жёстко зависят от образа axllent/mailpit: нет образа —
    # команда не стартует вовсе (проверено на пустом кэше), и это падение видно сразу, а не
    # тонет в отказе одного теста.
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: cms-db-1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cms_dev
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - cms-db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    container_name: cms-mailpit-1
    ports:
      - '127.0.0.1:8025:8025'
    healthcheck:
      # curl в образе нет, wget есть: `/readyz` отвечает 200, только когда SMTP-порт принимает
      # сообщения.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8025/readyz']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cms-db-data:
